services:
  mysql:
    image: mysql:8.4
    container_name: auricvista-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: auricvista_travel
      MYSQL_USER: auricvista
      MYSQL_PASSWORD: auricvista
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - auricvista_mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  auricvista_mysql:
